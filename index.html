<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Glass Kanban</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-container">
        <header class="app-header">
            <div class="logo">
                <i class="fa-solid fa-shapes"></i>
                <h1>Kanban Board</h1>
            </div>
            <div class="header-actions">
                <div class="search-bar">
                    <i class="fa-solid fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Search tasks...">
                </div>
                <button class="btn primary-btn" id="addTaskBtn">
                    <i class="fa-solid fa-plus"></i> New Task
                </button>
            </div>
        </header>

        <main class="board-container">
            <!-- To Do Column -->
            <section class="kanban-column" id="todo-column" data-status="todo">
                <div class="column-header">
                    <h2 class="col-title todo-title">
                        <span class="dot"></span> To Do
                    </h2>
                    <span class="task-count" id="todo-count">0</span>
                </div>
                <div class="task-list" id="todo-list">
                    <!-- Tasks will be injected here -->
                </div>
            </section>

            <!-- In Progress Column -->
            <section class="kanban-column" id="in-progress-column" data-status="in-progress">
                <div class="column-header">
                    <h2 class="col-title in-progress-title">
                        <span class="dot"></span> In Progress
                    </h2>
                    <span class="task-count" id="in-progress-count">0</span>
                </div>
                <div class="task-list" id="in-progress-list">
                    <!-- Tasks will be injected here -->
                </div>
            </section>

            <!-- Review Column -->
            <section class="kanban-column" id="review-column" data-status="review">
                <div class="column-header">
                    <h2 class="col-title review-title">
                        <span class="dot"></span> Review
                    </h2>
                    <span class="task-count" id="review-count">0</span>
                </div>
                <div class="task-list" id="review-list">
                    <!-- Tasks will be injected here -->
                </div>
            </section>

            <!-- Done Column -->
            <section class="kanban-column" id="done-column" data-status="done">
                <div class="column-header">
                    <h2 class="col-title done-title">
                        <span class="dot"></span> Done
                    </h2>
                    <span class="task-count" id="done-count">0</span>
                </div>
                <div class="task-list" id="done-list">
                    <!-- Tasks will be injected here -->
                </div>
            </section>
        </main>
    </div>

    <!-- Task Modal (Add/Edit) -->
    <div class="modal-overlay" id="taskModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">Add New Task</h3>
                <button class="close-btn" id="closeModalBtn"><i class="fa-solid fa-times"></i></button>
            </div>
            <div class="modal-body">
                <form id="taskForm">
                    <input type="hidden" id="taskId">
                    <div class="form-group">
                        <label for="taskTitle">Title</label>
                        <input type="text" id="taskTitle" required placeholder="What needs to be done?">
                    </div>
                    <div class="form-group">
                        <label for="taskDesc">Description</label>
                        <textarea id="taskDesc" rows="3" placeholder="Add detailed description..."></textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="taskStatus">Status</label>
                            <select id="taskStatus">
                                <option value="todo">To Do</option>
                                <option value="in-progress">In Progress</option>
                                <option value="review">Review</option>
                                <option value="done">Done</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="taskPriority">Priority</label>
                            <select id="taskPriority">
                                <option value="low">Low</option>
                                <option value="medium">Medium</option>
                                <option value="high">High</option>
                                <option value="urgent">Urgent</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Tags</label>
                        <div class="tag-selector" id="tagSelector">
                            <span class="tag-option" data-tag="UI/UX">UI/UX</span>
                            <span class="tag-option" data-tag="Bug">Bug</span>
                            <span class="tag-option" data-tag="Feature">Feature</span>
                            <span class="tag-option" data-tag="Research">Research</span>
                        </div>
                    </div>
                    <div class="modal-actions">
                        <button type="button" class="btn secondary-btn" id="cancelModalBtn">Cancel</button>
                        <button type="submit" class="btn primary-btn" id="saveTaskBtn">Save Task</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
